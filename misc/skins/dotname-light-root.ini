# DotName light skin using the fixed xterm 256-color palette.
# Requires a 256-color TERM entry; COLORTERM=truecolor is not needed.

[skin]
    description = DotName - Light (Root)
    256colors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[aliases]
    Main = color254
    MainFg = color16
    MarkedFg = color19
    HeaderFg = color61
    Selected = color161
    Dialog = color181
    DialogFocus = color146
    Input = Main
    PaleFg = color243
    ShadowFg = color16
    ShadowBg = color243
    Error = color239
    ErrorFocus = color60
    Top = color68
    MenuActive = Bottom
    MenuSelected = Top
    Bottom = color146
    BottomNumber = color103
    BottomNumberFg = color254
    Help = color188
    HelpBoldFg = ErrorFocus
    HelpItalicFg = Error
    HelpLinkFg = color68
    EditorLineNumber = color255
    EditorWhitespace = EditorLineNumber
    EditorRightMargin = EditorLineNumber
    EditorBookmark = Bottom
    EditorFindAll = Top
    EditorVoid = BottomNumber
    EditorFrameFg = MainFg
    EditorFrameActiveFg = MarkedFg
    EditorFrameDragFg = color231
    ViewerBoldFg = HelpBoldFg
    ViewerUnderlinedFg = HelpLinkFg
    ViewerSelected = EditorBookmark
    DiffAdd = color114
    DiffChangedLine = color188
    DiffGap = color174

[core]
    _default_ = MainFg;Main
    selected = ;Selected
    marked = MarkedFg;;bold
    markselect = MarkedFg;Selected;bold
    gauge = ;DialogFocus
    input = color16;Input
    inputunchanged = PaleFg;Input
    inputmark = color16;DialogFocus
    disabled = PaleFg;Dialog
    reverse = color16;Bottom
    commandlinemark = color16;DialogFocus
    header = HeaderFg
    shadow = ShadowFg;ShadowBg

[dialog]
    _default_ = color16;Dialog
    dfocus = ;DialogFocus
    dhotnormal = ;;underline
    dhotfocus = ;DialogFocus;underline
    dtitle = ;;bold

[error]
    _default_ = color231;Error
    errdfocus = ;ErrorFocus
    errdhotnormal = ;;underline
    errdhotfocus = ;ErrorFocus;underline
    errdtitle = ;;bold

[filehighlight]
    directory =
    executable = color34
    symlink = color90
    hardlink =
    stalelink = color160
    device = color107
    special = color143
    core = color178
    temp = color247
    archive = color24
    doc = color55
    source = color130
    media = color32
    graph = color37
    database = color173

[menu]
    _default_ = color16;MenuActive
    menusel = ;MenuSelected
    menuhot = ;;underline
    menuhotsel = ;MenuSelected;underline
    menuinactive = ;Top

[popupmenu]
    _default_ = color16;Dialog
    menusel = ;DialogFocus
    menutitle = ;;bold

[buttonbar]
    hotkey = BottomNumberFg;BottomNumber
    button = color16;Bottom

[statusbar]
    _default_ = color16;Top

[help]
    _default_ = color16;Help
    helpbold = HelpBoldFg;;bold
    helpitalic = HelpItalicFg;;italic
    helplink = HelpLinkFg;;underline
    helpslink = Help;HelpLinkFg

[editor]
    editbold = MarkedFg;;bold
    editmarked = ;Selected
    editwhitespace = ;EditorWhitespace
    editnonprintable = ;black
    editlinestate = color16;EditorLineNumber
    bookmark = color16;EditorBookmark
    bookmarkfound = color16;EditorFindAll
    editrightmargin = ;EditorRightMargin
    editbg = ;EditorVoid
    editframe = EditorFrameFg
    editframeactive = EditorFrameActiveFg
    editframedrag = EditorFrameDragFg

[viewer]
    viewbold = ViewerBoldFg;;bold
    viewunderline = ViewerUnderlinedFg;;underline
    viewselected = color16;ViewerSelected

[diffviewer]
    added = ;DiffAdd
    changedline = ;DiffChangedLine
    changednew = ;DiffAdd
    changed = ;DiffGap
    removed = ;DiffGap
    error = color231;Error

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
