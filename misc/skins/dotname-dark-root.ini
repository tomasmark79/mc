# DotName dark skin using the fixed xterm 256-color palette.
# Requires a 256-color TERM entry; COLORTERM=truecolor is not needed.

[skin]
    description = DotName - Dark (Root)
    256colors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[aliases]
    Main = color235
    MainFg = color145
    MarkedFg = color68
    HeaderFg = color74
    Selected = color52
    Dialog = color52
    DialogFocus = color95
    Input = MainFg
    PaleFg = color246
    ShadowFg = color16
    ShadowBg = color16
    Error = color167
    ErrorFocus = color174
    Top = color239
    MenuActive = Bottom
    MenuSelected = Top
    Bottom = color234
    BottomNumber = color237
    BottomNumberFg = color250
    Help = Bottom
    HelpBoldFg = ErrorFocus
    HelpItalicFg = Error
    HelpLinkFg = color68
    EditorLineNumber = color236
    EditorWhitespace = EditorLineNumber
    EditorRightMargin = EditorLineNumber
    EditorBookmark = color60
    EditorFindAll = Top
    EditorVoid = color234
    EditorFrameFg = MainFg
    EditorFrameActiveFg = MarkedFg
    EditorFrameDragFg = color250
    ViewerBoldFg = HelpBoldFg
    ViewerUnderlinedFg = HelpLinkFg
    ViewerSelected = EditorBookmark
    DiffAdd = color23
    DiffChangedLine = color235
    DiffGap = color131

[core]
    _default_ = MainFg;Main
    selected = MainFg;Selected
    marked = MarkedFg;;bold
    markselect = MarkedFg;Selected;bold
    gauge = MainFg;DialogFocus
    input = color235;color244
    inputunchanged = color239;color244
    inputmark = MainFg;DialogFocus
    disabled = PaleFg;Dialog
    reverse = MainFg;Bottom
    commandlinemark = MainFg;DialogFocus
    header = HeaderFg
    shadow = ShadowFg;ShadowBg

[dialog]
    _default_ = MainFg;Dialog
    dfocus = MainFg;DialogFocus
    dhotnormal = MainFg;;underline
    dhotfocus = MainFg;DialogFocus;underline
    dtitle = MainFg;;bold

[error]
    _default_ = color231;Error
    errdfocus = ;ErrorFocus
    errdhotnormal = ;;underline
    errdhotfocus = ;ErrorFocus;underline
    errdtitle = ;;bold

[filehighlight]
    directory =
    executable = color34
    symlink = color96
    hardlink =
    stalelink = color124
    device = color65
    special = color101
    core = color136
    temp = color242
    archive = color24
    doc = color60
    source = color130
    media = color31
    graph = color37
    database = color131

[menu]
    _default_ = MainFg;MenuActive
    menusel = MainFg;MenuSelected
    menuhot = MainFg;;underline
    menuhotsel = MainFg;MenuSelected;underline
    menuinactive = PaleFg;Top

[popupmenu]
    _default_ = MainFg;Dialog
    menusel = MainFg;DialogFocus
    menutitle = MainFg;;bold

[buttonbar]
    hotkey = BottomNumberFg;BottomNumber
    button = MainFg;Bottom

[statusbar]
    _default_ = MainFg;Top

[help]
    _default_ = MainFg;Help
    helpbold = HelpBoldFg;;bold
    helpitalic = HelpItalicFg;;italic
    helplink = HelpLinkFg;;underline
    helpslink = Help;HelpLinkFg

[editor]
    editbold = MarkedFg;;bold
    editmarked = MainFg;Selected
    editwhitespace = MainFg;EditorWhitespace
    editnonprintable = MainFg;Main
    editlinestate = MainFg;EditorLineNumber
    bookmark = MainFg;EditorBookmark
    bookmarkfound = MainFg;EditorFindAll
    editrightmargin = MainFg;EditorRightMargin
    editbg = MainFg;EditorVoid
    editframe = EditorFrameFg
    editframeactive = EditorFrameActiveFg
    editframedrag = EditorFrameDragFg

[viewer]
    viewbold = ViewerBoldFg;;bold
    viewunderline = ViewerUnderlinedFg;;underline
    viewselected = MainFg;ViewerSelected

[diffviewer]
    added = ;DiffAdd
    changedline = ;DiffChangedLine
    changednew = ;DiffAdd
    changed = ;DiffGap
    removed = ;DiffGap
    error = color231;Error

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
